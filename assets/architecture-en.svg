<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 268" width="1000" height="268" role="img" aria-label="aether architecture: browser to Vercel to Cloudflare Tunnel to VM running Hono, backed by Postgres and Redis">
